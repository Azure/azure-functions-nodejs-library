parameters:
    - name: NpmPublishTag
      displayName: 'Tag'
      type: string
      default: 'latest'
    - name: NpmPublishDryRun
      displayName: 'Dry Run'
      type: boolean
      default: true

trigger: none
pr: none

resources:
    repositories:
        - repository: 1es
          type: git
          name: 1ESPipelineTemplates/1ESPipelineTemplates
          ref: refs/tags/release
    pipelines:
        - pipeline: officialBuild
          project: internal
          source: nodejs-library.official
          branch: v4.x

extends:
    template: v1/1ES.Official.PipelineTemplate.yml@1es
    parameters:
        sdl:
            sourceAnalysisPool:
                name: 1es-pool-azfunc
                image: 1es-windows-2022
                os: windows
            codeql:
                runSourceLanguagesInSourceAnalysis: true

        stages:
            - stage: Release
              pool:
                  name: 1es-pool-azfunc
                  image: 1es-ubuntu-22.04
                  os: linux
              jobs:
                  - job: Release
                    steps:
                        - download: officialBuild
                        - template: /azure-pipelines/templates/npm-publish-steps.yml@self
                          parameters:
                            tgzPath: '$(Pipeline.Workspace)/officialBuild/drop'
                            NpmPublishTag: ${{ parameters.NpmPublishTag }}
                            NpmPublishDryRun: ${{ parameters.NpmPublishDryRun }}
